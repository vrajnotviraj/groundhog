<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 400" width="320" height="400">
  <!-- groundhog mascot tile: on ink, enlarged, cropped by the right and bottom edges, never whole -->
  <defs>
    <clipPath id="tile"><rect width="320" height="400" rx="6"/></clipPath>
  </defs>
  <rect width="320" height="400" rx="6" fill="#2A1D17"/>
  <g clip-path="url(#tile)">
    <g transform="translate(-200 10) scale(3.2)">
      <!-- body and belly -->
      <path d="M60 160V138a60 54 0 0 1 120 0v22z" fill="#B8AD9E"/>
      <path d="M84 160a36 38 0 0 1 72 0z" fill="#DAD5CA"/>
      <!-- ears -->
      <circle cx="86" cy="40" r="13" fill="#B8AD9E"/><circle cx="154" cy="40" r="13" fill="#B8AD9E"/>
      <circle cx="86" cy="42" r="6" fill="#DAD5CA"/><circle cx="154" cy="42" r="6" fill="#DAD5CA"/>
      <!-- head and muzzle -->
      <circle cx="120" cy="82" r="48" fill="#B8AD9E"/>
      <ellipse cx="120" cy="104" rx="20" ry="14" fill="#DAD5CA"/>
      <!-- eyes -->
      <circle cx="101" cy="80" r="8" fill="#2A1D17"/><circle cx="139" cy="80" r="8" fill="#2A1D17"/>
      <circle cx="104" cy="77" r="2.6" fill="#FFFFFF"/><circle cx="142" cy="77" r="2.6" fill="#FFFFFF"/>
      <!-- nose, smile, buck teeth -->
      <ellipse cx="120" cy="97" rx="6" ry="4" fill="#2A1D17"/>
      <path d="M113 103q7 6 14 0" fill="none" stroke="#2A1D17" stroke-width="2.5" stroke-linecap="round"/>
      <rect x="113" y="104" width="6.5" height="11" rx="2" fill="#FFFFFF"/><rect x="120.5" y="104" width="6.5" height="11" rx="2" fill="#FFFFFF"/>
      <!-- paws on the rim -->
      <rect x="72" y="146" width="30" height="14" rx="7" fill="#61524A"/><rect x="138" y="146" width="30" height="14" rx="7" fill="#61524A"/>
    </g>
  </g>
</svg>
