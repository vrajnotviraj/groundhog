[project]
name = "groundhog"
version = "0.1.0"
description = "AI-authored, deterministically-replayed web tests"
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.49",
    "pydantic>=2.9",
    "typer>=0.15",
    "rich>=13.9",
    "anthropic>=0.75",
    "neo4j>=5.26",
    "python-dotenv>=1.0",
]

[project.scripts]
groundhog = "groundhog.cli:app"

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["groundhog"]
