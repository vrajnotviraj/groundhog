[project]
name = "groundhog"
version = "0.1.0"
description = "AI-authored, deterministically-replayed web tests"
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.49",
    "pydantic>=2.9",
    "typer>=0.15",
    "rich>=13.9",
    "anthropic>=0.75",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pymongo>=4.19.0",
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
groundhog = "groundhog.cli:app"

[dependency-groups]
dev = [
    "mongomock>=4.3.0",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["groundhog"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Holds the app's login JS verbatim; rewrapping it would change what runs.
"groundhog/browser/session.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
